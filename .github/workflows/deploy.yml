name: Build and Deploy


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image_latest: ${{ steps.image_name.outputs.image_latest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image_name
        shell: bash
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "image_latest=$IMAGE_REPO:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.image_repo }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail

          required=(SSH_HOST SSH_USER SSH_PRIVATE_KEY GHCR_USERNAME GHCR_TOKEN)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing secret::Secret '$name' is not set."
              exit 1
            fi
          done

      - name: Debug SSH authentication (verbose)
        shell: bash
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -euo pipefail

          echo "== SSH diagnostic =="
          echo "Host: $SSH_HOST"
          echo "Port: $SSH_PORT"
          echo "User: $SSH_USER"

          echo "== DNS resolution =="
          getent hosts "$SSH_HOST" || echo "DNS lookup failed for $SSH_HOST"

          echo "== TCP port probe =="
          if timeout 5 bash -c "</dev/tcp/$SSH_HOST/$SSH_PORT"; then
            echo "TCP connectivity: ok"
          else
            echo "::warning title=Network issue::Cannot open TCP connection to $SSH_HOST:$SSH_PORT"
          fi

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/gha_deploy_key"
          chmod 600 "$HOME/.ssh/gha_deploy_key"

          echo "== Private key format check =="
          if ssh-keygen -y -f "$HOME/.ssh/gha_deploy_key" >/dev/null 2>&1; then
            echo "Private key format: valid"
          else
            echo "::warning title=Key format issue::SSH_PRIVATE_KEY format is invalid or passphrase-protected."
          fi

          echo "== Public key fingerprint =="
          ssh-keygen -lf "$HOME/.ssh/gha_deploy_key" || true

          echo "== SSH auth test =="
          set +e
          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            sshpass -p "$SSH_PASSPHRASE" ssh -vvv \
              -i "$HOME/.ssh/gha_deploy_key" \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=no \
              "$SSH_USER@$SSH_HOST" "echo ssh-auth-ok"
          else
            ssh -vvv \
              -i "$HOME/.ssh/gha_deploy_key" \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" "echo ssh-auth-ok"
          fi
          SSH_EXIT=$?
          set -e

          if [ "$SSH_EXIT" -ne 0 ]; then
            echo "::warning title=SSH auth failed::See verbose ssh output above for exact reason."
          fi

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" -p "${{ secrets.GHCR_TOKEN }}"
            docker pull "${{ needs.build_and_push.outputs.image_latest }}"

            docker rm -f city-time-api || true
            docker run -d \
              --name city-time-api \
              --restart always \
              -p 8000:8000 \
              "${{ needs.build_and_push.outputs.image_latest }}"

            docker image prune -f
